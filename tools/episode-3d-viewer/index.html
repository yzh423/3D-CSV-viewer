<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Episode 3D 轨迹查看器</title>
  <script src="vendor/papaparse.min.js"></script>
  <script src="vendor/plotly.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #66737d;
      --surface: #f7f8f6;
      --panel: #ffffff;
      --border: #d8ded9;
      --accent: #0d6b57;
      --accent-soft: #e3f1ec;
      --danger: #9c2f28;
      --danger-soft: #f8e8e6;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: clamp(20px, 2.4vw, 30px); letter-spacing: -.025em; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .privacy { white-space: nowrap; color: var(--accent); font-size: 13px; font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
      min-height: calc(100vh - 91px);
    }
    aside { min-width: 0; padding: 20px; border-right: 1px solid var(--border); background: var(--panel); }
    #drop-zone {
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 20px;
      border: 1px dashed #91a29a;
      border-radius: var(--radius);
      background: #fbfcfa;
      text-align: center;
      transition: border-color .15s, background .15s;
    }
    #drop-zone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    #drop-zone strong { display: block; margin-bottom: 5px; font-size: 15px; }
    #drop-zone span { color: var(--muted); font-size: 13px; }
    input[type="file"] { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }
    .button-row { display: flex; gap: 8px; margin-top: 14px; }
    .animation-panel { display: grid; gap: 10px; margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; background: #fbfcfa; }
    .animation-panel label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .animation-panel select { width: 100%; min-height: 34px; margin-top: 4px; border: 1px solid var(--border); border-radius: 5px; background: white; color: var(--ink); }
    .timeline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
    .timeline input { min-width: 0; width: 100%; accent-color: var(--accent); }
    .playback-options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .check-label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink) !important; font-weight: 500 !important; }
    button, .file-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .file-button { flex: 1; display: inline-grid; place-items: center; background: var(--accent); color: white; border-color: var(--accent); }
    button:hover, .file-button:hover { filter: brightness(.97); }
    button:focus-visible, .file-button:focus-visible { outline: 3px solid #8cc9ba; outline-offset: 2px; }
    aside h2 { margin: 24px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    #file-list {
      display: grid;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      max-height: clamp(220px, 35vh, 420px);
      gap: 8px;
      padding-right: 4px;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .file-card { min-width: 0; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    .file-card { display: block; height: auto; color: var(--ink); text-align: left; }
    .file-card[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .file-card strong { display: block; width: 100%; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .file-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    #error-list:empty { display: none; }
    #error-list { margin-top: 14px; padding: 10px 12px; border: 1px solid #edc6c2; border-radius: 6px; background: var(--danger-soft); color: var(--danger); font-size: 12px; }
    .workspace { position: relative; min-width: 0; min-height: 620px; background: #fff; }
    #plot { width: 100%; height: calc(100vh - 92px); min-height: 620px; }
    #empty-state {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      padding: 32px;
      text-align: center;
      pointer-events: none;
    }
    #empty-state .axes { font: 700 32px/1 ui-monospace, monospace; color: #98a59f; letter-spacing: 4px; }
    #empty-state h2 { margin: 18px 0 6px; font-size: 18px; }
    #empty-state p { margin: 0; color: var(--muted); font-size: 14px; }
    #point-status { min-height: 34px; margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      header { align-items: start; padding: 18px; }
      .privacy { display: none; }
      main { display: block; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      #drop-zone { min-height: 112px; }
      #file-list { max-height: min(300px, 38vh); }
      .workspace, #plot { min-height: 520px; height: 65vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Episode 3D 轨迹查看器</h1>
      <p>检查双臂 controller / TCP 的空间运动轨迹</p>
    </div>
    <div class="privacy">本地解析 · 数据不会上传</div>
  </header>
  <main>
    <aside aria-label="轨迹文件与控制">
      <div id="drop-zone" tabindex="0" role="button" aria-controls="csv-input">
        <div><strong>拖入 Episode CSV</strong><span>支持一次选择多个文件</span></div>
      </div>
      <input id="csv-input" type="file" accept=".csv,text/csv" multiple>
      <input id="folder-input" type="file" accept=".csv,text/csv" webkitdirectory multiple>
      <div class="button-row">
        <label for="csv-input" class="file-button" tabindex="0">选择 CSV</label>
        <label for="folder-input" class="file-button" tabindex="0">选择文件夹</label>
        <button id="reset-camera" type="button" disabled>重置视角</button>
      </div>
      <div class="animation-panel" aria-label="动画播放控制">
        <label for="episode-select">当前 Episode
          <select id="episode-select" disabled><option>尚未载入</option></select>
        </label>
        <div class="timeline">
          <button id="play-button" type="button" disabled>播放</button>
          <input id="time-slider" type="range" min="0" max="10000" value="0" disabled aria-label="播放时间">
          <output id="time-label" for="time-slider">0.00 / 0.00 s</output>
        </div>
        <div class="playback-options">
          <label for="speed-select">速度
            <select id="speed-select">
              <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
              <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
            </select>
          </label>
          <label class="check-label"><input id="loop-toggle" type="checkbox" checked>循环</label>
          <label class="check-label"><input id="right-toggle" type="checkbox" checked>右 TCP</label>
          <label class="check-label"><input id="left-toggle" type="checkbox" checked>左 TCP</label>
        </div>
      </div>
      <div id="parse-status" role="status" aria-live="polite"></div>
      <h2>已载入文件</h2>
      <div id="file-list"><span style="color:var(--muted);font-size:13px">尚未载入</span></div>
      <div id="error-list" role="alert" aria-live="assertive"></div>
      <div id="point-status" role="status" aria-live="polite">点击轨迹可查看采样点。</div>
    </aside>
    <section class="workspace" aria-label="三维轨迹图">
      <div id="empty-state">
        <div class="axes">X Y Z</div>
        <h2>等待轨迹数据</h2>
        <p>上传 CSV 后，可拖动旋转、滚轮缩放、图例隐藏轨迹。</p>
      </div>
      <div id="plot"></div>
    </section>
  </main>

  <script>
    const GROUPS = [
      { key: "right_controller", label: "右手 Controller", color: "#d45b45" },
      { key: "right_tcp", label: "右臂 TCP", color: "#e19a28" },
      { key: "left_controller", label: "左手 Controller", color: "#247aa5" },
      { key: "left_tcp", label: "左臂 TCP", color: "#0d8068" }
    ];
    // Explicit schema keys make support easy to audit.
    const SUPPORTED_X_COLUMNS = [
      "right_controller_pos_x", "right_tcp_pos_x",
      "left_controller_pos_x", "left_tcp_pos_x"
    ];
    const MAX_RENDER_POINTS = 12000;
    const DASHES = ["solid", "dash", "dot", "dashdot"];
    const input = document.getElementById("csv-input");
    const folderInput = document.getElementById("folder-input");
    const dropZone = document.getElementById("drop-zone");
    const plot = document.getElementById("plot");
    const fileList = document.getElementById("file-list");
    const errorList = document.getElementById("error-list");
    const emptyState = document.getElementById("empty-state");
    const parseStatus = document.getElementById("parse-status");
    const pointStatus = document.getElementById("point-status");
    const resetButton = document.getElementById("reset-camera");
    let currentTraces = [];
    let summaries = [];
    let errors = [];
    let activeEpisodeIndex = -1;
    let savedCamera = null;

    function copyCamera(camera) {
      return camera ? JSON.parse(JSON.stringify(camera)) : null;
    }

    function rememberCurrentCamera() {
      const camera = plot._fullLayout && plot._fullLayout.scene && plot._fullLayout.scene.camera;
      if (camera) savedCamera = copyCamera(camera);
    }

    function saveCameraFromRelayout(event) {
      if (event && event["scene.camera"]) {
        savedCamera = copyCamera(event["scene.camera"]);
        return;
      }
      const cameraParts = Object.entries(event || {}).filter(([key]) => key.startsWith("scene.camera."));
      if (!cameraParts.length) return;
      const nextCamera = copyCamera(savedCamera) || copyCamera(plot._fullLayout.scene.camera);
      for (const [key, value] of cameraParts) {
        const path = key.slice("scene.camera.".length).split(".");
        let target = nextCamera;
        for (const part of path.slice(0, -1)) target = target[part] ||= {};
        target[path.at(-1)] = value;
      }
      savedCamera = nextCamera;
    }

    function sceneWithSavedCamera(scene) {
      return savedCamera ? { ...scene, camera: copyCamera(savedCamera) } : scene;
    }

    async function resetCameraView() {
      savedCamera = null;
      await Plotly.relayout(plot, { "scene.camera": null });
      savedCamera = null;
    }

    function fileDisplayName(file) {
      return file.webkitRelativePath || file.name;
    }

    function sampleIndices(length) {
      if (length <= MAX_RENDER_POINTS) return Array.from({ length }, (_, i) => i);
      const stride = (length - 1) / (MAX_RENDER_POINTS - 1);
      return Array.from({ length: MAX_RENDER_POINTS }, (_, i) => Math.round(i * stride));
    }

    function parseFile(file, fileIndex) {
      return new Promise(resolve => {
        Papa.parse(file, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: "greedy",
          complete(result) {
            const fields = result.meta.fields || [];
            const rows = result.data || [];
            const traces = [];
            for (const group of GROUPS) {
              const columns = ["x", "y", "z"].map(axis => `${group.key}_pos_${axis}`);
              if (!columns.every(column => fields.includes(column))) continue;
              const valid = rows.map((row, index) => ({ row, index })).filter(({ row }) =>
                columns.every(column => Number.isFinite(Number(row[column])))
              );
              const indices = sampleIndices(valid.length);
              const selected = indices.map(index => valid[index]);
              if (!selected.length) continue;
              traces.push({
                type: "scatter3d",
                mode: "lines",
                name: `${file.name} · ${group.label}`,
                x: selected.map(({ row }) => Number(row[columns[0]])),
                y: selected.map(({ row }) => Number(row[columns[1]])),
                z: selected.map(({ row }) => Number(row[columns[2]])),
                customdata: selected.map(({ row, index }) => [row.t, index, file.name, group.label]),
                hovertemplate: "%{customdata[2]}<br>%{customdata[3]}<br>t=%{customdata[0]:.3f}s<br>x=%{x:.4f}<br>y=%{y:.4f}<br>z=%{z:.4f}<extra></extra>",
                line: { color: group.color, width: 5, dash: DASHES[fileIndex % DASHES.length] }
              });
            }
            const times = rows.map(row => Number(row.t)).filter(Number.isFinite);
            const frames = rows.map(row => row.coordinate_frame).filter(Boolean);
            const duration = times.length > 1 ? times[times.length - 1] - times[0] : 0;
            const parseErrors = result.errors.filter(item => item.code !== "UndetectableDelimiter");
            resolve({
              traces,
              summary: { name: file.name, rows: rows.length, duration, frame: frames[0] || "未知", groups: traces.length },
              error: traces.length ? (parseErrors.length ? `${file.name}: 忽略 ${parseErrors.length} 个格式问题` : null) : `${file.name}: No usable XYZ trajectories`
            });
          },
          error(reason) { resolve({ traces: [], summary: null, error: `${file.name}: ${reason.message || reason}` }); }
        });
      });
    }

    function renderSidebar() {
      fileList.innerHTML = summaries.length ? summaries.map((item, index) => `
        <button type="button" class="file-card" data-episode-index="${index}" aria-current="${activeEpisodeIndex === index}">
          <strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong>
          <span>${item.rows.toLocaleString()} 点 · ${item.duration.toFixed(2)} 秒 · ${escapeHtml(item.frame)}</span>
          <span>${item.groups} 条可用轨迹</span>
        </button>`).join("") : '<span style="color:var(--muted);font-size:13px">尚未载入</span>';
      errorList.innerHTML = errors.map(item => `<div>${escapeHtml(item)}</div>`).join("");
    }

    function escapeHtml(value) {
      const node = document.createElement("span");
      node.textContent = String(value);
      return node.innerHTML;
    }

    async function loadFiles(files) {
      const csvFiles = Array.from(files).filter(file => file.name.toLowerCase().endsWith(".csv"));
      currentTraces = []; summaries = []; errors = [];
      parseStatus.textContent = csvFiles.length ? `正在解析 ${csvFiles.length} 个文件…` : "请选择 CSV 文件。";
      const results = await Promise.all(csvFiles.map(parseFile));
      results.forEach(result => {
        currentTraces.push(...result.traces);
        if (result.summary) summaries.push(result.summary);
        if (result.error) errors.push(result.error);
      });
      renderSidebar();
      emptyState.hidden = currentTraces.length > 0;
      resetButton.disabled = currentTraces.length === 0;
      parseStatus.textContent = currentTraces.length ? `已绘制 ${currentTraces.length} 条轨迹。` : "未找到可绘制轨迹。";
      Plotly.react(plot, currentTraces, {
        margin: { l: 0, r: 0, t: 32, b: 0 },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        legend: { orientation: "h", x: 0.02, y: 1.02, bgcolor: "rgba(255,255,255,.85)" },
        scene: sceneWithSavedCamera({
          aspectmode: "data",
          xaxis: { title: "X (m)", gridcolor: "#e3e7e4", zerolinecolor: "#aab5af" },
          yaxis: { title: "Y (m)", gridcolor: "#e3e7e4", zerolinecolor: "#aab5af" },
          zaxis: { title: "Z (m)", gridcolor: "#e3e7e4", zerolinecolor: "#aab5af" },
          bgcolor: "#fbfcfa"
        }),
        uirevision: "persistent-camera"
      }, { responsive: true, displaylogo: false, scrollZoom: true });
    }

    Plotly.newPlot(plot, [], {
      margin: { l: 0, r: 0, t: 0, b: 0 },
      paper_bgcolor: "#ffffff",
      scene: { aspectmode: "data", bgcolor: "#fbfcfa" }
    }, { responsive: true, displaylogo: false, scrollZoom: true });

    input.addEventListener("change", event => loadFiles(event.target.files));
    dropZone.addEventListener("click", () => input.click());
    dropZone.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); input.click(); }
    });
    ["dragenter", "dragover"].forEach(type => dropZone.addEventListener(type, event => {
      event.preventDefault(); dropZone.classList.add("dragging");
    }));
    ["dragleave", "drop"].forEach(type => dropZone.addEventListener(type, event => {
      event.preventDefault(); dropZone.classList.remove("dragging");
    }));
    dropZone.addEventListener("drop", event => loadFiles(event.dataTransfer.files));
    resetButton.addEventListener("click", resetCameraView);
    plot.on("plotly_relayout", event => {
      if (Object.keys(event || {}).some(key => key.startsWith("scene.camera"))) {
        saveCameraFromRelayout(event);
      }
    });
    plot.on("plotly_click", event => {
      const point = event.points[0];
      if (!point || !point.customdata) return;
      const meta = point.customdata;
      pointStatus.textContent = `${meta[2]} · ${meta[3]} · 第 ${meta[1] + 1} 点 · t=${Number(meta[0]).toFixed(3)}s · (${point.x.toFixed(4)}, ${point.y.toFixed(4)}, ${point.z.toFixed(4)})`;
    });
  </script>
  <script>
    // Desktop-equivalent TCP animation layer.
    const AXIS_COLORS = ["#d33f31", "#2e8b57", "#2d65c4"];
    const AXIS_LABELS = ["工具轴 X", "工具轴 Y", "工具轴 Z"];
    const SUPPORTED_QUATERNION_COLUMNS = [
      "right_tcp_quat_w", "right_tcp_quat_x", "right_tcp_quat_y", "right_tcp_quat_z",
      "left_tcp_quat_w", "left_tcp_quat_x", "left_tcp_quat_y", "left_tcp_quat_z"
    ];
    const episodeSelect = document.getElementById("episode-select");
    const playButton = document.getElementById("play-button");
    const timeSlider = document.getElementById("time-slider");
    const timeLabel = document.getElementById("time-label");
    const speedSelect = document.getElementById("speed-select");
    const loopToggle = document.getElementById("loop-toggle");
    const rightToggle = document.getElementById("right-toggle");
    const leftToggle = document.getElementById("left-toggle");
    let loadedEpisodes = [];
    let activeEpisode = null;
    let playbackTime = 0;
    let playing = false;
    let animationRequest = null;
    let previousFrameAt = 0;
    let userInteracting = false;

    function quaternionToMatrix(quaternion) {
      const [w0, x0, y0, z0] = quaternion.map(Number);
      const norm = Math.hypot(w0, x0, y0, z0);
      if (!Number.isFinite(norm) || norm < 1e-12) return null;
      const [w, x, y, z] = [w0 / norm, x0 / norm, y0 / norm, z0 / norm];
      return [
        [1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)],
        [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)],
        [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]
      ];
    }

    function nearestIndex(times, target) {
      if (!times.length || target <= times[0]) return 0;
      if (target >= times[times.length - 1]) return times.length - 1;
      let low = 0, high = times.length - 1;
      while (low < high) {
        const middle = Math.floor((low + high) / 2);
        if (times[middle] < target) low = middle + 1; else high = middle;
      }
      if (low === 0) return 0;
      return target - times[low - 1] <= times[low] - target ? low - 1 : low;
    }

    function buildTcpSeries(rows, fields, side, startTime) {
      const positions = ["x", "y", "z"].map(axis => `${side}_tcp_pos_${axis}`);
      const quaternions = ["w", "x", "y", "z"].map(axis => `${side}_tcp_quat_${axis}`);
      if (![...positions, ...quaternions, "t"].every(field => fields.includes(field))) return null;
      const samples = rows.map((row, rowIndex) => ({
        time: Number(row.t) - startTime,
        position: positions.map(column => Number(row[column])),
        quaternion: quaternions.map(column => Number(row[column])),
        rowIndex
      })).filter(sample =>
        Number.isFinite(sample.time) && sample.position.every(Number.isFinite) && quaternionToMatrix(sample.quaternion)
      ).sort((a, b) => a.time - b.time);
      if (!samples.length) return null;
      return {
        side,
        times: samples.map(sample => sample.time),
        positions: samples.map(sample => sample.position),
        quaternions: samples.map(sample => sample.quaternion),
        rowIndices: samples.map(sample => sample.rowIndex)
      };
    }

    function enhancedParseFile(file, fileIndex) {
      return new Promise(resolve => Papa.parse(file, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: "greedy",
        complete(result) {
          const fields = result.meta.fields || [];
          const rows = result.data || [];
          const name = fileDisplayName(file);
          const rawTimes = rows.map(row => Number(row.t)).filter(Number.isFinite);
          const startTime = rawTimes.length ? rawTimes[0] : 0;
          const duration = rawTimes.length > 1 ? rawTimes[rawTimes.length - 1] - startTime : 0;
          const frames = rows.map(row => row.coordinate_frame).filter(Boolean);
          const traces = [];
          for (const group of GROUPS) {
            const columns = ["x", "y", "z"].map(axis => `${group.key}_pos_${axis}`);
            if (!columns.every(column => fields.includes(column))) continue;
            const valid = rows.map((row, index) => ({ row, index })).filter(({ row }) =>
              columns.every(column => Number.isFinite(Number(row[column])))
            );
            const selected = sampleIndices(valid.length).map(index => valid[index]);
            if (!selected.length) continue;
            const side = group.key.startsWith("right") ? "right" : "left";
            traces.push({
              type: "scatter3d", mode: "lines", name: group.label,
              x: selected.map(({ row }) => Number(row[columns[0]])),
              y: selected.map(({ row }) => Number(row[columns[1]])),
              z: selected.map(({ row }) => Number(row[columns[2]])),
              customdata: selected.map(({ row, index }) => [row.t, index, name, group.label]),
              hovertemplate: "%{customdata[2]}<br>%{customdata[3]}<br>t=%{customdata[0]:.3f}s<br>x=%{x:.4f}<br>y=%{y:.4f}<br>z=%{z:.4f}<extra></extra>",
              line: { color: group.color, width: group.key.includes("tcp") ? 3 : 2, dash: group.key.includes("tcp") ? "solid" : "dot" },
              opacity: group.key.includes("tcp") ? 0.28 : 0.48,
              meta: { side, kind: group.key.includes("tcp") ? "tcp-full" : "controller" }
            });
          }
          const tcpSeries = {};
          const hasTcpPositionColumns = side => ["x", "y", "z"].every(axis => fields.includes(`${side}_tcp_pos_${axis}`));
          const tcpPositionSides = ["right", "left"].filter(hasTcpPositionColumns);
          for (const side of ["right", "left"]) {
            const series = buildTcpSeries(rows, fields, side, startTime);
            if (series) tcpSeries[side] = series;
          }
          const parseErrors = result.errors.filter(item => item.code !== "UndetectableDelimiter");
          const frame = frames[0] || "未知";
          resolve({
            name, traces, tcpSeries, tcpPositionSides, duration, frame, rows: rows.length,
            summary: { name, rows: rows.length, duration, frame, groups: traces.length },
            error: traces.length ? (parseErrors.length ? `${name}: 忽略 ${parseErrors.length} 个格式问题` : null) : `${name}: No usable XYZ trajectories`
          });
        },
        error(reason) {
          const name = fileDisplayName(file);
          resolve({ name, traces: [], tcpSeries: {}, tcpPositionSides: [], duration: 0, rows: 0, error: `${name}: ${reason.message || reason}` });
        }
      }));
    }

    function animationTraces(episode) {
      episode.animationIndices = {};
      const traces = [];
      let axisLegendAdded = false;
      const allPositions = Object.values(episode.tcpSeries).flatMap(series => series.positions);
      if (allPositions.length) {
        const ranges = [0, 1, 2].map(axis => {
          const values = allPositions.map(position => position[axis]);
          return Math.max(...values) - Math.min(...values);
        });
        episode.axisLength = Math.max(Math.max(...ranges) * 0.10, 0.025);
      }
      for (const [side, series] of Object.entries(episode.tcpSeries)) {
        const color = side === "right" ? "#e19a28" : "#0d8068";
        const base = episode.traces.length + traces.length;
        episode.animationIndices[side] = [base, base + 1, base + 2, base + 3, base + 4];
        traces.push(
          { type: "scatter3d", mode: "lines", name: `${side === "right" ? "右" : "左"} TCP 已走`, x: [], y: [], z: [], line: { color, width: 6 }, meta: { side, kind: "traversed" } },
          { type: "scatter3d", mode: "markers", name: `${side === "right" ? "右" : "左"} TCP 当前`, x: [], y: [], z: [], marker: { color, size: 5 }, showlegend: false, meta: { side, kind: "origin" } },
          ...AXIS_COLORS.map((axisColor, axis) => ({
            type: "scatter3d", mode: "lines", name: AXIS_LABELS[axis], x: [], y: [], z: [],
            line: { color: axisColor, width: 7 }, legendgroup: `tool-axis-${axis}`,
            showlegend: !axisLegendAdded, hoverinfo: "skip", meta: { side, kind: "axis", axis }
          }))
        );
        axisLegendAdded = true;
      }
      return traces;
    }

    function computeSceneRanges(episode) {
      const values = [[], [], []];
      for (const trace of episode.traces) {
        [trace.x, trace.y, trace.z].forEach((coordinates, axis) => {
          for (const value of coordinates || []) if (Number.isFinite(Number(value))) values[axis].push(Number(value));
        });
      }
      const margin = Math.max(episode.axisLength * 1.25, 0.01);
      return values.map(axisValues => {
        if (!axisValues.length) return [-0.5, 0.5];
        const minimum = Math.min(...axisValues), maximum = Math.max(...axisValues);
        const center = (minimum + maximum) / 2;
        const half = Math.max((maximum - minimum) / 2 + margin, margin);
        return [center - half, center + half];
      });
    }

    async function renderActiveEpisode(index) {
      pauseAnimation();
      rememberCurrentCamera();
      activeEpisode = loadedEpisodes[index] || null;
      activeEpisodeIndex = activeEpisode ? index : -1;
      playbackTime = 0;
      if (!activeEpisode) return;
      currentTraces = [...activeEpisode.traces, ...animationTraces(activeEpisode)];
      activeEpisode.sceneRanges = computeSceneRanges(activeEpisode);
      await Plotly.react(plot, currentTraces, {
        margin: { l: 0, r: 0, t: 32, b: 0 }, paper_bgcolor: "#fff", plot_bgcolor: "#fff",
        legend: { orientation: "h", x: 0.02, y: 1.02, bgcolor: "rgba(255,255,255,.85)", groupclick: "togglegroup" },
        scene: sceneWithSavedCamera({
          aspectmode: "data", bgcolor: "#fbfcfa",
          xaxis: { title: "X (m)", gridcolor: "#e3e7e4", autorange: false, range: activeEpisode.sceneRanges[0] },
          yaxis: { title: "Y (m)", gridcolor: "#e3e7e4", autorange: false, range: activeEpisode.sceneRanges[1] },
          zaxis: { title: "Z (m)", gridcolor: "#e3e7e4", autorange: false, range: activeEpisode.sceneRanges[2] }
        }), uirevision: "persistent-camera"
      }, { responsive: true, displaylogo: false, scrollZoom: true });
      timeSlider.disabled = activeEpisode.duration <= 0;
      playButton.disabled = !Object.keys(activeEpisode.tcpSeries).length || activeEpisode.duration <= 0;
      for (const [side, toggle] of [["right", rightToggle], ["left", leftToggle]]) {
        const available = activeEpisode.traces.some(trace => trace.meta && trace.meta.side === side);
        toggle.disabled = !available;
        toggle.checked = available;
      }
      emptyState.hidden = currentTraces.length > 0;
      resetButton.disabled = currentTraces.length === 0;
      renderAnimationFrame(0);
      applyArmVisibility();
      renderSidebar();
      requestAnimationFrame(() => {
        const card = fileList.querySelector(`[data-episode-index="${index}"]`);
        if (card) card.scrollIntoView({ block: "nearest", inline: "nearest" });
      });
    }

    function renderAnimationFrame(time) {
      if (!activeEpisode) return;
      playbackTime = Math.max(0, Math.min(time, activeEpisode.duration));
      const indices = [], xs = [], ys = [], zs = [];
      for (const [side, series] of Object.entries(activeEpisode.tcpSeries)) {
        const sampleIndex = nearestIndex(series.times, playbackTime);
        const origin = series.positions[sampleIndex];
        const rotation = quaternionToMatrix(series.quaternions[sampleIndex]);
        const traceIndices = activeEpisode.animationIndices[side];
        const traversed = series.positions.slice(0, sampleIndex + 1);
        indices.push(traceIndices[0], traceIndices[1]);
        xs.push(traversed.map(p => p[0]), [origin[0]]); ys.push(traversed.map(p => p[1]), [origin[1]]); zs.push(traversed.map(p => p[2]), [origin[2]]);
        for (let axis = 0; axis < 3; axis += 1) {
          const endpoint = origin.map((value, row) => value + rotation[row][axis] * activeEpisode.axisLength);
          indices.push(traceIndices[axis + 2]); xs.push([origin[0], endpoint[0]]); ys.push([origin[1], endpoint[1]]); zs.push([origin[2], endpoint[2]]);
        }
      }
      if (indices.length) Plotly.restyle(plot, { x: xs, y: ys, z: zs }, indices);
      timeSlider.value = activeEpisode.duration ? Math.round(playbackTime / activeEpisode.duration * 10000) : 0;
      timeLabel.textContent = `${playbackTime.toFixed(2)} / ${activeEpisode.duration.toFixed(2)} s`;
    }

    function animationLoop(now) {
      if (!playing || !activeEpisode) return;
      if (!previousFrameAt) previousFrameAt = now;
      const delta = Math.min((now - previousFrameAt) / 1000, 0.1) * Number(speedSelect.value);
      previousFrameAt = now;
      let next = playbackTime + delta;
      if (next >= activeEpisode.duration) {
        if (loopToggle.checked) next %= Math.max(activeEpisode.duration, 1e-9);
        else { next = activeEpisode.duration; pauseAnimation(); }
      }
      if (userInteracting) {
        playbackTime = next;
        timeSlider.value = activeEpisode.duration ? Math.round(playbackTime / activeEpisode.duration * 10000) : 0;
        timeLabel.textContent = `${playbackTime.toFixed(2)} / ${activeEpisode.duration.toFixed(2)} s`;
      } else {
        renderAnimationFrame(next);
      }
      if (playing) animationRequest = requestAnimationFrame(animationLoop);
    }

    function pauseAnimation() {
      playing = false; previousFrameAt = 0; playButton.textContent = "播放";
      if (animationRequest) cancelAnimationFrame(animationRequest);
      animationRequest = null;
    }

    function toggleAnimation() {
      if (playing) return pauseAnimation();
      if (!activeEpisode) return;
      rememberCurrentCamera();
      if (playbackTime >= activeEpisode.duration) renderAnimationFrame(0);
      playing = true; playButton.textContent = "暂停";
      animationRequest = requestAnimationFrame(animationLoop);
    }

    function applyArmVisibility() {
      const updates = [], indices = [];
      Array.from(plot.data || []).forEach((trace, index) => {
        const side = trace.meta && trace.meta.side;
        if (side === "right" || side === "left") {
          indices.push(index); updates.push(side === "right" ? rightToggle.checked : leftToggle.checked);
        }
      });
      if (indices.length) Plotly.restyle(plot, { visible: updates }, indices);
    }

    async function enhancedLoadFiles(files) {
      const csvFiles = Array.from(files)
        .filter(file => file.name.toLowerCase().endsWith(".csv"))
        .sort((a, b) => fileDisplayName(a).localeCompare(fileDisplayName(b), "zh-CN", { numeric: true, sensitivity: "base" }));
      if (!csvFiles.length) {
        parseStatus.textContent = "所选内容中没有 CSV 文件。";
        return;
      }
      pauseAnimation(); loadedEpisodes = []; summaries = []; errors = [];
      parseStatus.textContent = `正在解析 ${csvFiles.length} 个文件…`;
      const results = await Promise.all(csvFiles.map(enhancedParseFile));
      loadedEpisodes = results.filter(result => result.traces.length);
      summaries = loadedEpisodes.map(result => result.summary);
      errors = results.flatMap(result => {
        const notices = result.error ? [result.error] : [];
        for (const side of ["right", "left"]) {
          if (result.tcpPositionSides.includes(side) && !result.tcpSeries[side]) {
            notices.push(`${result.name}: ${side === "right" ? "右" : "左"} TCP 缺少有效四元数，无法动画`);
          }
        }
        return notices;
      });
      renderSidebar();
      episodeSelect.innerHTML = loadedEpisodes.length ? loadedEpisodes.map((episode, index) => `<option value="${index}">${escapeHtml(episode.name)}</option>`).join("") : "<option>尚未载入</option>";
      episodeSelect.disabled = loadedEpisodes.length === 0;
      parseStatus.textContent = loadedEpisodes.length ? `已载入 ${loadedEpisodes.length} 个 Episode。` : "未找到可绘制轨迹。";
      await renderActiveEpisode(0);
    }

    parseFile = enhancedParseFile;
    loadFiles = enhancedLoadFiles;
    folderInput.addEventListener("change", event => loadFiles(event.target.files));
    episodeSelect.addEventListener("change", event => renderActiveEpisode(Number(event.target.value)));
    fileList.addEventListener("click", event => {
      const card = event.target.closest(".file-card[data-episode-index]");
      if (!card) return;
      const index = Number(card.dataset.episodeIndex);
      episodeSelect.value = String(index);
      renderActiveEpisode(index);
    });
    playButton.addEventListener("click", toggleAnimation);
    timeSlider.addEventListener("input", event => {
      pauseAnimation();
      if (activeEpisode) renderAnimationFrame(activeEpisode.duration * Number(event.target.value) / 10000);
    });
    rightToggle.addEventListener("change", applyArmVisibility);
    leftToggle.addEventListener("change", applyArmVisibility);
    plot.addEventListener("mousedown", () => { userInteracting = true; });
    plot.addEventListener("touchstart", () => { userInteracting = true; }, { passive: true });
    function finishCameraInteraction() {
      if (!userInteracting) return;
      userInteracting = false;
      rememberCurrentCamera();
    }
    document.addEventListener("mouseup", finishCameraInteraction);
    document.addEventListener("touchend", finishCameraInteraction, { passive: true });
  </script>
</body>
</html>
